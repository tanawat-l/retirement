<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Finance & FIRE Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
/* ── reset ── */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:#f4f3ef;color:#1a1917;}
button{cursor:pointer;font-family:inherit;}
input,select,textarea{font-family:inherit;}

/* ── desktop layout ── */
.app-shell{display:flex;height:100vh;overflow:hidden;}
#sidebar{width:220px;min-width:220px;background:#161614;color:#f0efe8;display:flex;flex-direction:column;height:100vh;overflow-y:auto;flex-shrink:0;}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
#bottom-nav{display:none;}

/* ── sidebar ── */
#sidebar-header{padding:20px 18px 14px;border-bottom:1px solid #252422;}
#sidebar-title{font-size:16px;font-weight:700;color:#F7931A;letter-spacing:.02em;}
#sidebar-sub{font-size:11px;color:#444;margin-top:3px;}
.nav-section{padding:14px 12px 4px;font-size:10px;color:#3a3a38;letter-spacing:.1em;text-transform:uppercase;font-weight:600;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 18px;font-size:13px;color:#888;cursor:pointer;border-left:2px solid transparent;transition:all .15s;}
.nav-item:hover{color:#f0efe8;background:#1e1d1b;}
.nav-item.active{color:#F7931A;border-left-color:#F7931A;background:#1e1d1b;}
.nav-item .icon{font-size:14px;width:16px;text-align:center;}
#sidebar-footer{padding:14px 18px;border-top:1px solid #252422;font-size:11px;color:#333;margin-top:auto;}

/* ── topbar ── */
#topbar{background:#fff;border-bottom:1px solid #e8e6e0;padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
#page-title{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.month-select{border:1px solid #e0ded8;border-radius:6px;padding:5px 8px;font-size:13px;background:#f4f3ef;outline:none;}

/* ── content ── */
#content{flex:1;overflow-y:auto;padding:20px 24px;}

/* ── cards ── */
.card{background:#fff;border:1px solid #e8e6e0;border-radius:10px;padding:16px 18px;margin-bottom:14px;}
.card-title{font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;font-weight:600;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.stat-card{background:#fff;border:1px solid #e8e6e0;border-radius:10px;padding:14px 16px;}
.stat-label{font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px;}
.stat-val{font-size:21px;font-weight:700;line-height:1.2;}
.stat-sub{font-size:12px;color:#999;margin-top:3px;}

/* ── table ── */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:400px;}
th{text-align:left;padding:8px 10px;background:#f4f3ef;color:#777;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;border-bottom:1px solid #e8e6e0;}
td{padding:8px 10px;border-bottom:1px solid #f0efe8;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#faf9f6;}

/* ── forms ── */
.form-row{display:grid;gap:10px;margin-bottom:10px;}
.form-row.cols-4{grid-template-columns:repeat(4,1fr);}
.form-row.cols-3{grid-template-columns:repeat(3,1fr);}
.form-row.cols-2{grid-template-columns:1fr 1fr;}
.form-row.cols-5{grid-template-columns:repeat(5,1fr);}
label{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:4px;}
input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{width:100%;border:1px solid #e0ded8;border-radius:6px;padding:9px 10px;font-size:14px;outline:none;background:#fff;color:#1a1917;}
input:focus,select:focus,textarea:focus{border-color:#F7931A;box-shadow:0 0 0 2px rgba(247,147,26,.1);}
textarea{resize:vertical;min-height:70px;}

/* ── buttons ── */
.btn{padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;border:none;letter-spacing:.01em;}
.btn-primary{background:#F7931A;color:#fff;}
.btn-primary:hover{background:#e07e10;}
.btn-ghost{background:transparent;border:1px solid #e0ded8;color:#555;}
.btn-ghost:hover{background:#f4f3ef;}
.btn-sm{padding:5px 11px;font-size:12px;}

/* ── misc ── */
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;}
.badge-green{background:#dcfce7;color:#166534;}
.badge-orange{background:#fff7ed;color:#c2410c;}
.progress{height:8px;background:#f0efe8;border-radius:99px;overflow:hidden;margin:4px 0;}
.progress-fill{height:100%;border-radius:99px;transition:width .4s;}
.section-divider{font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:.1em;padding:14px 0 8px;font-weight:600;border-top:1px solid #f0efe8;margin-top:6px;}
.empty-state{color:#bbb;text-align:center;padding:32px 20px;font-size:14px;}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:5px;background:#f0efe8;color:#666;}
.del-btn{background:none;border:none;color:#ddd;font-size:13px;padding:2px 6px;}
.del-btn:hover{color:#ef4444;}
.two-col-layout{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start;}
.budget-over{color:#ef4444;font-weight:600;}
.budget-ok{color:#16a34a;font-weight:600;}
.highlight-box{background:#fffbf5;border:1px solid #fde68a;border-radius:8px;padding:12px 14px;font-size:13px;color:#92400e;line-height:1.6;margin-bottom:10px;}
.green-box{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px 14px;font-size:13px;color:#166534;line-height:1.6;margin-bottom:10px;}
.fire-num{font-size:26px;font-weight:700;color:#F7931A;}

/* ── bottom nav (mobile) ── */
#bottom-nav{position:fixed;bottom:0;left:0;right:0;height:58px;background:#161614;border-top:1px solid #252422;display:flex;align-items:stretch;z-index:100;}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:transparent;border:none;color:#555;cursor:pointer;padding:6px 2px;-webkit-tap-highlight-color:transparent;}
.bnav-item.active{color:#F7931A;}
.bnav-icon{font-size:18px;line-height:1;}
.bnav-label{font-size:9px;letter-spacing:.03em;font-family:inherit;}

/* ── more drawer (mobile) ── */
#more-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;}
#more-sheet{display:none;position:fixed;bottom:58px;left:0;right:0;background:#fff;border-radius:16px 16px 0 0;padding:16px;z-index:201;box-shadow:0 -4px 24px rgba(0,0,0,.15);}
#more-sheet.open,#more-overlay.open{display:block;}
.more-header{font-size:13px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;}
.more-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.more-btn{padding:14px 6px;background:#f4f3ef;border:none;border-radius:10px;text-align:center;font-size:11px;cursor:pointer;color:#1a1917;font-family:inherit;line-height:1.4;}
.more-btn-icon{font-size:20px;display:block;margin-bottom:4px;}
.more-btn:active{background:#e8e6e0;}

/* ══════════════════════════════
   RESPONSIVE — MOBILE
══════════════════════════════ */
@media (max-width:768px){
  .app-shell{flex-direction:column;height:auto;overflow:auto;height:100dvh;}
  #sidebar{display:none;}
  #main{flex:1;overflow:hidden;display:flex;flex-direction:column;}
  #bottom-nav{display:flex;}
  #topbar{padding:0 14px;height:48px;}
  #page-title{font-size:15px;}
  #topbar-btn-text{display:none;}
  #content{padding:12px 12px 72px;}
  .grid-4{grid-template-columns:1fr 1fr;gap:8px;}
  .grid-3{grid-template-columns:1fr 1fr;gap:8px;}
  .grid-2{grid-template-columns:1fr;gap:10px;}
  .two-col-layout{grid-template-columns:1fr;gap:10px;}
  .form-row.cols-4,.form-row.cols-5{grid-template-columns:1fr 1fr;}
  .form-row.cols-3{grid-template-columns:1fr 1fr;}
  .stat-val{font-size:18px;}
  .stat-card,.card{padding:12px 13px;}
  table{font-size:12px;min-width:340px;}
  th,td{padding:7px 8px;}
  .fire-num{font-size:22px;}
  .btn{font-size:13px;padding:10px 14px;}
  input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{font-size:16px;}/* prevent zoom on iOS */
}
@media (max-width:400px){
  .grid-4,.grid-3{grid-template-columns:1fr 1fr;}
  .more-grid{grid-template-columns:repeat(3,1fr);}
}
</style>
</head>
<body>
<div class="app-shell">

let DB=initDB(), activeMonth='2026-05', activeChart=null;
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(DB));const el=document.getElementById('last-saved');if(el)el.textContent=new Date().toLocaleTimeString();}
function uid(){return'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function fmt(n,d=0){n=parseFloat(n)||0;if(n>=1e6)return'฿'+(n/1e6).toFixed(2)+'M';if(n>=1000)return'฿'+(n/1000).toFixed(d)+'k';return'฿'+n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
function fmtFull(n){return'฿'+Math.round(parseFloat(n)||0).toLocaleString();}
function monthLabel(m){if(!m)return'';const[y,mo]=m.split('-');return['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(mo)-1]+' '+y;}
function txForMonth(m){return DB.transactions.filter(t=>t.date.startsWith(m));}
function incForMonth(m){return DB.income.filter(i=>i.month===m);}
function spentForMonth(m){return txForMonth(m).filter(t=>t.category!=='ออมเงิน, ลงทุน').reduce((s,t)=>s+(t.amount||0),0);}
function investForMonth(m){return txForMonth(m).filter(t=>t.category==='ออมเงิน, ลงทุน').reduce((s,t)=>s+(t.amount||0),0);}
function incTotalForMonth(m){return incForMonth(m).reduce((s,i)=>s+(i.amount||0),0);}

// ═══════════════════════════════════════════════
// ROUTER
// ═══════════════════════════════════════════════
const PAGE_TITLES={dashboard:'Dashboard',transactions:'Transactions',income:'Income',budget:'Budget Plan',notes:'Monthly Notes',fire:'FIRE Overview',portfolio:'Portfolio Log',networth:'Net Worth',tax:'Tax Planner',goals:'Goals'};
function navigate(page){
  if(activeChart){try{activeChart.destroy();}catch{}activeChart=null;}
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.page===page));
  document.querySelectorAll('.bnav-item[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));
  document.getElementById('page-title').textContent=PAGE_TITLES[page]||page;
  const pages={dashboard:renderDashboard,transactions:renderTransactions,income:renderIncome,budget:renderBudget,notes:renderNotes,fire:renderFire,portfolio:renderPortfolio,networth:renderNetworth,tax:renderTax,goals:renderGoals};
  if(pages[page])pages[page]();
  document.getElementById('content').scrollTop=0;
}
document.querySelectorAll('.nav-item,.bnav-item[data-page]').forEach(el=>el.addEventListener('click',()=>navigate(el.dataset.page)));

function toggleMore(){
  document.getElementById('more-overlay').classList.toggle('open');
  document.getElementById('more-sheet').classList.toggle('open');
}

function buildMonthSelect(){
  const sel=document.getElementById('active-month');
  const months=[];
  for(let y=2025;y<=2027;y++)for(let m=1;m<=12;m++)months.push(`${y}-${String(m).padStart(2,'0')}`);
  sel.innerHTML=months.map(m=>`<option value="${m}"${m===activeMonth?' selected':''}>${monthLabel(m)}</option>`).join('');
  sel.onchange=()=>{activeMonth=sel.value;navigate(document.querySelector('.nav-item.active')?.dataset.page||'dashboard');};
}

// FIRE MATH
// ═══════════════════════════════════════════════
function projPort(months){const m=0.30/12;let v=50000;for(let i=0;i<months;i++)v=v*(1+m)+(i<8?4500:10500);return v;}
function fireTarget(yrs){return 16000*Math.pow(1.1,yrs)*12*25;}
function runwayAge(retireAge,portfolio,postReturn){
  const yrs=retireAge-23;let annual=16000*Math.pow(1.1,yrs)*12,p=portfolio;
  for(let y=0;y<120;y++){p=p*(1+postReturn)-annual;annual*=1.1;if(p<=0)return retireAge+y+1;}return 999;
}

      x:{ticks:{font:{size:10},color:'#aaa'},grid:{display:false}},
      y:{ticks:{font:{size:10},color:'#aaa',callback:v=>fmt(v)},grid:{color:'#f4f3ef'}},
    }}});
  },50);
}

function addPortfolio(){
  const date=document.getElementById('p-date').value;if(!date)return alert('Select month.');
  const entry={id:uid(),date,emergency:parseFloat(document.getElementById('p-emg').value)||0,bitcoin:parseFloat(document.getElementById('p-btc').value)||0,gold:parseFloat(document.getElementById('p-gold').value)||0,rmf:parseFloat(document.getElementById('p-rmf').value)||0,salary:parseFloat(document.getElementById('p-salary').value)||0,notes:document.getElementById('p-notes').value};
  const idx=DB.portfolio.findIndex(p=>p.date===date);
  if(idx>=0)DB.portfolio[idx]=entry;else{DB.portfolio.push(entry);DB.portfolio.sort((a,b)=>a.date.localeCompare(b.date));}
  save();checkGoals();renderPortfolio();
}
function delPortfolio(id){if(!confirm('Delete?'))return;DB.portfolio=DB.portfolio.filter(p=>p.id!==id);save();renderPortfolio();}

      <div><label>Category</label><select id="at-cat">${aCats.map(c=>`<option>${c}</option>`).join('')}</select></div>

    ${DB.assets.filter(a=>a.type==='asset').map(a=>`<tr><td><strong>${a.name}</strong></td><td><span class="tag">${a.category}</span></td><td><input type="number" value="${a.value}" style="width:110px;border:1px solid #e0ded8;border-radius:4px;padding:4px 6px;font-size:13px" onchange="updateAsset('${a.id}',this.value)"></td><td><button class="del-btn" onclick="delAsset('${a.id}')">✕</button></td></tr>`).join('')}
  </tbody></table></div><div style="text-align:right;font-weight:700;padding-top:8px;border-top:1px solid #f0efe8;margin-top:4px;color:#16a34a">Total Assets: ${fmtFull(ta)}</div></div>`:''}
  ${DB.assets.filter(a=>a.type==='liability').length>0?`<div class="card"><div class="card-title">Liabilities</div><div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Category</th><th>Amount (฿)</th><th></th></tr></thead><tbody>
    ${DB.assets.filter(a=>a.type==='liability').map(a=>`<tr><td><strong>${a.name}</strong></td><td><span class="tag">${a.category}</span></td><td><input type="number" value="${a.value}" style="width:110px;border:1px solid #e0ded8;border-radius:4px;padding:4px 6px;font-size:13px" onchange="updateAsset('${a.id}',this.value)"></td><td><button class="del-btn" onclick="delAsset('${a.id}')">✕</button></td></tr>`).join('')}
  </tbody></table></div><div style="text-align:right;font-weight:700;padding-top:8px;border-top:1px solid #f0efe8;margin-top:4px;color:#dc2626">Total Debt: ${fmtFull(tl)}</div></div>`:''}

function addAsset(){const type=document.getElementById('at-type').value,cat=document.getElementById('at-cat').value,name=document.getElementById('at-name').value.trim(),value=parseFloat(document.getElementById('at-value').value)||0;if(!name)return alert('Enter a name.');DB.assets.push({id:uid(),type,category:cat,name,value});save();renderNetworth();}
function delAsset(id){if(!confirm('Delete?'))return;DB.assets=DB.assets.filter(a=>a.id!==id);save();renderNetworth();}
function updateAsset(id,val){const a=DB.assets.find(x=>x.id===id);if(a){a.value=parseFloat(val)||0;save();}}

// ═══════════════════════════════════════════════
// TAX
// ═══════════════════════════════════════════════
function thaiTax(inc,rmf=0,ssf=0,li=0,hi=0){
  const ed=Math.min(inc*.5,100000),pd=60000;
  const td=ed+pd+Math.min(rmf,inc*.30,500000)+Math.min(ssf,inc*.30,200000)+Math.min(li,100000)+Math.min(hi,25000);
  const tx=Math.max(0,inc-td);
  const brackets=[[150000,0],[150000,.05],[200000,.10],[250000,.15],[250000,.20],[1000000,.25],[3000000,.30],[Infinity,.35]];
  let tax=0,rem=tx;for(const[sz,rate]of brackets){if(rem<=0)break;tax+=Math.min(rem,sz)*rate;rem-=sz;}
  return{taxable:tx,tax:Math.round(tax),totalDed:td};
}
function renderTax(){
  const t=DB.tax,before=thaiTax(t.income),after=thaiTax(t.income,t.rmf,t.ssf,t.lifeIns,t.healthIns),saved=before.tax-after.tax,maxRmf=Math.min(t.income*.30,500000);
  document.getElementById('content').innerHTML=`
  <div class="grid-2">
    <div class="card">
      <div class="card-title">Income & Deductions</div>
      <div class="form-row cols-2">
        <div><label>Annual Income (฿)</label><input type="number" id="tx-inc" value="${t.income}" onchange="updateTax('income',this.value)"></div>
        <div><label>= Monthly</label><input type="number" value="${Math.round(t.income/12)}" readonly style="background:#f4f3ef;color:#999"></div>
      </div>
      <div class="section-divider">Tax Reduction Tools</div>
      ${[['rmf',`RMF (max ${fmtFull(maxRmf)})`,maxRmf],['ssf','SSF (max ฿200k)',Math.min(t.income*.30,200000)],['lifeIns','Life Insurance (max ฿100k)',100000],['healthIns','Health Insurance (max ฿25k)',25000]].map(([k,label,max])=>`
        <div style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;margin-bottom:5px">
            <label style="font-size:12px;color:#666;text-transform:none;letter-spacing:0;margin:0">${label}</label>
            <strong style="color:#F7931A">${fmtFull(t[k]||0)}</strong>
          </div>
          <input type="range" min="0" max="${max}" step="1000" value="${t[k]||0}" oninput="updateTax('${k}',this.value)" style="width:100%;accent-color:#F7931A;margin-bottom:6px">
          <input type="number" value="${t[k]||0}" onchange="updateTax('${k}',this.value)">
        </div>`).join('')}
    </div>
    <div>
      <div class="card">
        <div class="card-title">Result</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
          <div style="background:#fef2f2;border-radius:8px;padding:14px;text-align:center"><div style="font-size:11px;color:#dc2626;font-weight:600;text-transform:uppercase;margin-bottom:4px">Without</div><div style="font-size:22px;font-weight:700;color:#dc2626">${fmtFull(before.tax)}</div></div>
          <div style="background:#f0fdf4;border-radius:8px;padding:14px;text-align:center"><div style="font-size:11px;color:#16a34a;font-weight:600;text-transform:uppercase;margin-bottom:4px">With Deductions</div><div style="font-size:22px;font-weight:700;color:#16a34a">${fmtFull(after.tax)}</div></div>
        </div>
        <div style="background:#fffbf5;border:1px solid #fed7aa;border-radius:8px;padding:14px;text-align:center;margin-bottom:12px">
          <div style="font-size:11px;color:#c2410c;font-weight:600;text-transform:uppercase;margin-bottom:4px">Annual Tax Saved</div>
          <div style="font-size:26px;font-weight:700;color:#F7931A">${fmtFull(saved)}</div>
          <div style="font-size:12px;color:#999;margin-top:3px">${fmtFull(saved/12)}/month · ${t.income>0?((after.tax/t.income)*100).toFixed(2):0}% effective rate</div>
        </div>
        <div style="font-size:13px;color:#666;line-height:1.8">
          Taxable income: ${fmtFull(after.taxable)}<br>
          Unused RMF: ${fmtFull(Math.max(0,maxRmf-(t.rmf||0)))} → ${fmtFull(Math.max(0,maxRmf-(t.rmf||0))/12)}/mo<br>
          Tax refund month: <strong>March</strong> → recycle into BTC DCA
        </div>
      </div>
      <div class="card">
        <div class="card-title">Thai Tax Brackets</div>
        ${[[0,150000,'0%'],[150001,300000,'5%'],[300001,500000,'10%'],[500001,750000,'15%'],[750001,1000000,'20%'],[1000001,2000000,'25%'],[2000001,5000000,'30%'],[5000001,99999999,'35%']].map(([lo,hi,rate])=>{
          const inB=after.taxable>lo;
          return`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f4f3ef;font-size:12px"><span style="color:${inB?'#F7931A':'#999'}">${lo.toLocaleString()} – ${hi>9e6?'∞':hi.toLocaleString()}</span><span style="font-weight:${inB?700:400};color:${inB?'#F7931A':'#999'}">${rate}</span></div>`;
        }).join('')}
        <div style="font-size:12px;color:#888;margin-top:8px">Taxable income: <strong style="color:#F7931A">${fmtFull(after.taxable)}</strong></div>
      </div>
    </div>
  </div>`;
}
function updateTax(k,v){DB.tax[k]=parseFloat(v)||0;save();renderTax();}

// ═══════════════════════════════════════════════
// GOALS
// ═══════════════════════════════════════════════
function checkGoals(){
  const latest=DB.portfolio.at(-1);if(!latest)return;
  const total=['emergency','bitcoin','gold','rmf'].reduce((s,k)=>s+(parseFloat(latest[k])||0),0);
  DB.goals.forEach(g=>{
    if(DB.goalHits[g.id])return;
    const v=g.cat==='bitcoin'?(parseFloat(latest.bitcoin)||0):g.cat==='emergency'?(parseFloat(latest.emergency)||0):g.cat==='income'?(parseFloat(latest.salary)||0):total;
    if(v>=g.target)DB.goalHits[g.id]=latest.date;
  });save();
}
function renderGoals(){
  const latest=DB.portfolio.at(-1);
  const total=latest?['emergency','bitcoin','gold','rmf'].reduce((s,k)=>s+(parseFloat(latest[k])||0),0):0;
  const btc=parseFloat(latest?.bitcoin)||0,emg=parseFloat(latest?.emergency)||0;
  const done=DB.goals.filter(g=>DB.goalHits[g.id]).length;
  document.getElementById('content').innerHTML=`
  <div class="card" style="margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div class="card-title" style="margin:0">Milestones</div>
      <span style="font-size:16px;font-weight:700;color:#F7931A">${done} / ${DB.goals.length}</span>
    </div>
    <div class="progress" style="height:10px"><div class="progress-fill" style="width:${(done/DB.goals.length)*100}%;background:#F7931A;height:10px"></div></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:14px">
    ${DB.goals.map(g=>{
      const dn=!!DB.goalHits[g.id];
      const cur=g.cat==='bitcoin'?btc:g.cat==='emergency'?emg:total;
      const pct=Math.min((cur/g.target)*100,100);
      const color=CAT_COLORS[g.cat]||'#F7931A';
      return`<div style="background:#fff;border:1px solid ${dn?color+'55':'#e8e6e0'};border-radius:10px;padding:14px;opacity:${dn?.75:1}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px">
          <div><div style="font-size:14px;font-weight:600;color:${dn?color:'#1a1917'}">${dn?'✓ ':''} ${g.name}</div><div style="font-size:12px;color:#999;margin-top:2px">${g.note}</div></div>
          <div style="text-align:right;flex-shrink:0"><div style="font-size:13px;font-weight:700;color:${color}">${fmtFull(g.target)}</div>${dn?`<div style="font-size:10px;color:#999">${DB.goalHits[g.id]}</div>`:''}</div>
        </div>
        ${!dn?`<div class="progress"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div><div style="display:flex;justify-content:space-between;font-size:11px;color:#999;margin-top:3px"><span>${fmtFull(cur)} / ${fmtFull(g.target)}</span><span>${pct.toFixed(1)}%</span></div>`:''}
        <span style="font-size:10px;padding:2px 7px;border-radius:99px;background:${color}22;color:${color};font-weight:600;display:inline-block;margin-top:6px;letter-spacing:.04em">${g.cat.toUpperCase()}</span>
      </div>`;
    }).join('')}
  </div>
  <div class="card">
    <div class="card-title">Add Custom Goal</div>
    <div class="form-row cols-4">
      <div><label>Name</label><input type="text" id="g-name" placeholder="Goal name"></div>
      <div><label>Target (฿)</label><input type="number" id="g-target" placeholder="250000"></div>
      <div><label>Category</label><select id="g-cat">${['portfolio','bitcoin','emergency','income','realestate','custom'].map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div><label>Note</label><input type="text" id="g-note" placeholder="Why this matters"></div>
    </div>
    <button class="btn btn-primary" onclick="addGoal()">+ Add Goal</button>
  </div>`;
}
function addGoal(){
  const name=document.getElementById('g-name').value.trim(),target=parseFloat(document.getElementById('g-target').value)||0,cat=document.getElementById('g-cat').value,note=document.getElementById('g-note').value;
  if(!name||!target)return alert('Fill name and target.');
  DB.goals.push({id:uid(),name,target,cat,note});save();renderGoals();
}

function exportData(){const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='finance_'+new Date().toISOString().slice(0,10)+'.json';a.click();}
function importData(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{DB=JSON.parse(ev.target.result);save();alert('Imported.');navigate('dashboard');}catch{alert('Invalid file.');}};r.readAsText(f);};inp.click();}
